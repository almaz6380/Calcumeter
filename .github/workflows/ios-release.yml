# iOS-App bauen und zu App Store Connect (TestFlight) hochladen – ohne eigenen Mac.
# Start: GitHub → Actions → „iOS Release“ → Run workflow.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Inhalt der .p8, App-Manager-Rechte); APPLE_TEAM_ID optional (Standard JU8STVD4SJ).
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Zu App Store Connect hochladen
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Xcode wählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Web-App bauen und in iOS kopieren
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archiv bauen
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID || 'JU8STVD4SJ' }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD=$(( ${{ github.run_number }} + 10 ))
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Calcumeter.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error|warning: .*sign|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Calcumeter.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }
          echo "Build-Nummer $BUILD"

      - name: Exportieren und hochladen
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID || 'JU8STVD4SJ' }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DEST=${{ inputs.upload && 'upload' || 'export' }}
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Calcumeter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40

      - name: Logs sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
